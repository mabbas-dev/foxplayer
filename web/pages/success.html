<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="FOX PLAYER Connected — Your IPTV configuration has been saved." />
  <title>FOX PLAYER Connected</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080A0F;
      --card: #161C26;
      --brand: #E8321A;
      --text: #F0F2F5;
      --text2: #9BA3B2;
      --text3: #5C6370;
      --success: #22C55E;
      --border: rgba(255,255,255,0.08);
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      text-align: center;
    }

    .logo {
      font-size: 32px;
      font-weight: 900;
      color: var(--brand);
      letter-spacing: 6px;
      margin-bottom: 2px;
    }

    .logo-sub {
      font-size: 10px;
      font-weight: 600;
      color: var(--text3);
      letter-spacing: 4px;
      margin-bottom: 48px;
    }

    .success-circle {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: rgba(34,197,94,0.12);
      border: 2px solid rgba(34,197,94,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
      animation: pop 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }

    @keyframes pop {
      from { transform: scale(0); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .check {
      font-size: 40px;
      color: var(--success);
      font-weight: 900;
      line-height: 1;
    }

    .title {
      font-size: 24px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 12px;
      letter-spacing: -0.3px;
    }

    .subtitle {
      font-size: 15px;
      color: var(--text2);
      line-height: 1.6;
      margin-bottom: 36px;
      max-width: 340px;
    }

    .instruction {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
      max-width: 400px;
      width: 100%;
      margin-bottom: 24px;
    }

    .instruction-step {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 14px;
      text-align: left;
    }

    .instruction-step:last-child { margin-bottom: 0; }

    .step-num {
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(232,50,26,0.15);
      border: 1px solid rgba(232,50,26,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--brand);
    }

    .step-text {
      font-size: 14px;
      color: var(--text2);
      line-height: 1.5;
      padding-top: 3px;
    }

    .step-text strong { color: var(--text); }

    .device-id {
      font-size: 13px;
      color: var(--text3);
      margin-top: 8px;
    }

    .device-id span {
      font-family: 'Courier New', monospace;
      color: var(--brand);
      font-size: 14px;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <div class="logo">FOX</div>
  <div class="logo-sub">PLAYER</div>

  <div class="success-circle">
    <span class="check">&#10003;</span>
  </div>

  <h1 class="title">FOX PLAYER CONNECTED</h1>
  <p class="subtitle">Your IPTV configuration has been saved successfully.</p>

  <div class="instruction">
    <div class="instruction-step">
      <div class="step-num">1</div>
      <div class="step-text">Return to your <strong>FOX PLAYER</strong> device</div>
    </div>
    <div class="instruction-step">
      <div class="step-num">2</div>
      <div class="step-text">Select <strong>Reload Playlist</strong></div>
    </div>
    <div class="instruction-step">
      <div class="step-num">3</div>
      <div class="step-text">Your channels and content will load automatically</div>
    </div>
  </div>

  <div class="device-id" id="device-id-info"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get('device-id') || params.get('device_id') || params.get('deviceId');
    if (id) {
      document.getElementById('device-id-info').innerHTML = 'Device ID: <span>' + id + '</span>';
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="description" content="Connect your FOX PLAYER device by entering your IPTV details." />
  <title>Connect FOX PLAYER</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #080A0F;
      --bg2:     #0D1117;
      --bg3:     #131820;
      --card:    #161C26;
      --brand:   #E8321A;
      --brand-hover: #FF472B;
      --text:    #F0F2F5;
      --text2:   #9BA3B2;
      --text3:   #5C6370;
      --border:  rgba(255,255,255,0.08);
      --border2: rgba(255,255,255,0.18);
      --error:   #EF4444;
      --success: #22C55E;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 60px;
    }

    /* Logo */
    .logo-wrap { text-align: center; margin-bottom: 28px; }
    .logo     { font-size: 40px; font-weight: 900; color: var(--brand); letter-spacing: 8px; }
    .logo-sub { font-size: 11px; font-weight: 600; color: var(--text3); letter-spacing: 5px; margin-top: 4px; }

    /* Title */
    .page-title { font-size: 26px; font-weight: 800; text-align: center; margin-bottom: 8px; }
    .page-sub   { font-size: 14px; color: var(--text2); text-align: center; margin-bottom: 24px; max-width: 440px; line-height: 1.4; }

    /* Device badge */
    .device-badge {
      display: none;
      align-items: center;
      justify-content: space-between;
      background: var(--card);
      border: 1px solid rgba(232,50,26,0.4);
      border-radius: 12px;
      padding: 12px 18px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 480px;
    }
    .badge-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .badge-label { font-size: 11px; font-weight: 700; color: var(--text3); letter-spacing: 2px; text-transform: uppercase; }
    .badge-id    { font-size: 22px; font-weight: 800; color: var(--brand); letter-spacing: 4px; font-family: 'Courier New', monospace; }
    .badge-change {
      background: transparent;
      border: none;
      color: var(--text3);
      font-size: 12px;
      cursor: pointer;
      text-decoration: underline;
      padding: 4px 8px;
    }
    .badge-change:hover { color: var(--text); }

    /* Card */
    .card {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.5);
    }

    /* Alert */
    .alert {
      display: none;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 20px;
      line-height: 1.4;
    }
    .alert.error   { display: block; background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.4); color: var(--error); }
    .alert.success { display: block; background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.4); color: var(--success); }

    /* ======= STEP 1: DEVICE ID ======= */
    #step-id { display: block; }
    .step-heading { font-size: 11px; font-weight: 700; color: var(--text3); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; }
    .id-row { display: flex; gap: 10px; }
    .id-input {
      flex: 1;
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: 8px;
      color: var(--brand);
      font-size: 20px;
      font-weight: 800;
      font-family: 'Courier New', monospace;
      letter-spacing: 5px;
      padding: 12px 14px;
      outline: none;
      text-transform: uppercase;
      text-align: center;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .id-input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 2px rgba(232,50,26,0.25);
    }
    .id-input::placeholder { color: var(--text3); font-size: 13px; font-weight: 400; letter-spacing: 1px; font-family: inherit; }
    .id-btn {
      padding: 12px 22px;
      background: var(--brand);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s, opacity 0.2s;
    }
    .id-btn:hover    { background: var(--brand-hover); }
    .id-btn:disabled { opacity: 0.5; cursor: default; }
    .id-hint { font-size: 12px; color: var(--text3); margin-top: 10px; line-height: 1.5; }

    /* ======= STEP 2: CONFIG FORM ======= */
    #step-config { display: none; }

    /* Tabs */
    .tabs {
      display: flex;
      background: var(--bg2);
      border-radius: 10px;
      padding: 4px;
      gap: 6px;
      margin-bottom: 22px;
    }
    .tab {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text2);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .tab.active { background: var(--brand); color: #fff; }
    .tab:hover:not(.active) { background: rgba(255,255,255,0.06); color: var(--text); }

    /* Panels */
    .panel { display: none; }
    .panel.active { display: block; }

    /* Fields */
    .field { margin-bottom: 18px; }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--text3);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .field input {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: 8px;
      color: var(--text);
      font-size: 15px;
      padding: 13px 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
    }
    .field input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 2px rgba(232,50,26,0.25);
    }
    .field input::placeholder { color: var(--text3); }
    .field-hint { font-size: 12px; color: var(--text3); margin-top: 6px; }

    /* Submit button */
    .submit-btn {
      width: 100%;
      padding: 15px;
      background: var(--brand);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      margin-top: 6px;
    }
    .submit-btn:hover    { background: var(--brand-hover); }
    .submit-btn:disabled { opacity: 0.5; cursor: default; }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 500px) {
      body { padding: 24px 12px 48px; }
      .card { padding: 20px; }
      .logo { font-size: 32px; }
      .id-input { font-size: 18px; letter-spacing: 4px; }
    }
  </style>
</head>
<body>

  <div class="logo-wrap">
    <div class="logo">FOX</div>
    <div class="logo-sub">PLAYER</div>
  </div>

  <h1 class="page-title">Connect FOX PLAYER</h1>
  <p class="page-sub" id="page-sub">Enter the Device ID shown in your FOX PLAYER app</p>

  <!-- Device badge (shown once connected) -->
  <div class="device-badge" id="badge">
    <div class="badge-left">
      <span class="badge-label">Device</span>
      <span class="badge-id" id="badge-id">--------</span>
    </div>
    <button type="button" class="badge-change" onclick="changeDevice()">Change</button>
  </div>

  <div class="card">

    <div class="alert" id="alert-box"></div>

    <!-- STEP 1: Device ID Entry -->
    <div id="step-id">
      <div class="step-heading">Device ID</div>
      <div class="id-row">
        <input
          type="text"
          id="id-input"
          class="id-input"
          maxlength="8"
          placeholder="e.g. 1PFDES0P"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="characters"
          spellcheck="false"
        />
        <button type="button" class="id-btn" id="id-btn" onclick="connectDevice()">Connect</button>
      </div>
      <div class="id-hint">Enter the 8-character uppercase code displayed on your FOX PLAYER screen</div>
    </div>

    <!-- STEP 2: IPTV Configuration Form -->
    <div id="step-config">

      <div class="tabs">
        <button type="button" class="tab active" id="tab-m3u" onclick="switchTab('m3u')">M3U PLAYLIST</button>
        <button type="button" class="tab" id="tab-xtream" onclick="switchTab('xtream')">XTREAM CODES</button>
      </div>

      <form id="cfg-form" onsubmit="doSubmit(event)" novalidate>

        <!-- M3U panel -->
        <div class="panel active" id="panel-m3u">
          <div class="field">
            <label for="f-url">Playlist URL</label>
            <input type="url" id="f-url"
              placeholder="http://provider.com/get.php?..."
              autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" />
            <div class="field-hint">The full M3U / M3U8 URL provided by your IPTV service</div>
          </div>
          <div class="field">
            <label for="f-name">Playlist Name (optional)</label>
            <input type="text" id="f-name" placeholder="My Playlist" autocomplete="off" />
          </div>
        </div>

        <!-- Xtream Codes panel -->
        <div class="panel" id="panel-xtream">
          <div class="field">
            <label for="f-srv">Server URL</label>
            <input type="url" id="f-srv"
              placeholder="http://server.com:8080"
              autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" />
          </div>
          <div class="field">
            <label for="f-usr">Username</label>
            <input type="text" id="f-usr"
              placeholder="Your username"
              autocomplete="username" autocorrect="off" autocapitalize="none" spellcheck="false" />
          </div>
          <div class="field">
            <label for="f-pwd">Password</label>
            <input type="password" id="f-pwd"
              placeholder="Your password"
              autocomplete="current-password" />
          </div>
        </div>

        <button type="submit" class="submit-btn" id="save-btn">Save Configuration</button>

      </form>
    </div>

  </div>

  <div style="margin-top: 22px; text-align: center; font-size: 13px; color: var(--text3);">
    Manage, switch, or remove playlists? <a href="/manage" id="manage-link" style="color: var(--brand); text-decoration: none; font-weight: 700;">Open Playlist Dashboard &rarr;</a>
  </div>

<script>
var currentDeviceId = null;
var currentTab = 'm3u';

function $(id) {
  return document.getElementById(id);
}

function showAlert(msg, type) {
  var el = $('alert-box');
  if (!el) return;
  el.className = 'alert ' + (type || 'error');
  el.textContent = msg;
  el.style.display = 'block';
}

function hideAlert() {
  var el = $('alert-box');
  if (!el) return;
  el.className = 'alert';
  el.textContent = '';
  el.style.display = 'none';
}

function setBusy(btnId, isBusy, idleText) {
  var b = $(btnId);
  if (!b) return;
  b.disabled = isBusy;
  b.innerHTML = isBusy ? '<span class="spinner"></span>Please wait...' : idleText;
}

function switchTab(name) {
  currentTab = name;
  var isM3u = (name === 'm3u');

  var tabM3u = $('tab-m3u');
  var tabXtream = $('tab-xtream');
  var panelM3u = $('panel-m3u');
  var panelXtream = $('panel-xtream');

  if (tabM3u) tabM3u.className = 'tab' + (isM3u ? ' active' : '');
  if (tabXtream) tabXtream.className = 'tab' + (!isM3u ? ' active' : '');
  if (panelM3u) panelM3u.style.display = isM3u ? 'block' : 'none';
  if (panelXtream) panelXtream.style.display = !isM3u ? 'block' : 'none';

  hideAlert();
}

function showConfig(devId) {
  currentDeviceId = devId;

  // Update badge
  var badge = $('badge');
  var badgeId = $('badge-id');
  if (badgeId) badgeId.textContent = devId;
  if (badge) badge.style.display = 'flex';

  // Hide device ID input step, show config form
  var stepId = $('step-id');
  var stepConfig = $('step-config');
  var pageSub = $('page-sub');

  if (stepId) stepId.style.display = 'none';
  if (stepConfig) stepConfig.style.display = 'block';
  if (pageSub) pageSub.textContent = 'Enter your IPTV details to connect';

  var mLink = $('manage-link');
  if (mLink) mLink.href = '/manage?device_id=' + devId;

  hideAlert();

  // Pre-load existing config if available
  fetch('/api/device/' + devId + '/status')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data && data.success && data.configured && data.config_type) {
        switchTab(data.config_type);
      }
    })
    .catch(function() {});
}

function changeDevice() {
  currentDeviceId = null;
  var badge = $('badge');
  var stepId = $('step-id');
  var stepConfig = $('step-config');
  var pageSub = $('page-sub');

  if (badge) badge.style.display = 'none';
  if (stepId) stepId.style.display = 'block';
  if (stepConfig) stepConfig.style.display = 'none';
  if (pageSub) pageSub.textContent = 'Enter the Device ID shown in your FOX PLAYER app';

  var input = $('id-input');
  if (input) {
    input.value = '';
    input.focus();
  }
  hideAlert();
}

function connectDevice() {
  hideAlert();
  var input = $('id-input');
  if (!input) return;

  var raw = (input.value || '').toUpperCase().replace(/[^A-Z0-9]/g, '').trim();
  if (raw.length !== 8) {
    showAlert('Device ID must be exactly 8 characters (letters and numbers only).', 'error');
    input.focus();
    return;
  }

  setBusy('id-btn', true, 'Connect');

  // Verify device was registered by the FOX PLAYER app
  fetch('/api/device/' + raw + '/status')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data && data.success) {
        showConfig(raw);
        if (data.configured && data.config_type) {
          switchTab(data.config_type);
        }
      } else {
        showAlert('Device not found. Please install and launch FOX PLAYER app first to get your Device ID.', 'error');
        input.focus();
      }
    })
    .catch(function(err) {
      showAlert('Cannot connect to server. Please check your connection.', 'error');
    })
    .finally(function() {
      setBusy('id-btn', false, 'Connect');
    });
}

function doSubmit(e) {
  if (e && e.preventDefault) e.preventDefault();
  hideAlert();

  if (!currentDeviceId || currentDeviceId.length !== 8) {
    showAlert('Please connect a valid Device ID first.', 'error');
    return false;
  }

  var payload = { type: currentTab };

  if (currentTab === 'm3u') {
    var url = ($('f-url') ? $('f-url').value : '').trim();
    var name = ($('f-name') ? $('f-name').value : '').trim();

    if (!url) {
      showAlert('Please enter your Playlist URL.', 'error');
      if ($('f-url')) $('f-url').focus();
      return false;
    }
    if (!/^https?:\/\//i.test(url)) {
      showAlert('Please enter a valid URL starting with http:// or https://', 'error');
      if ($('f-url')) $('f-url').focus();
      return false;
    }

    payload.playlist_url = url;
    payload.playlist_name = name;
  } else {
    var srv = ($('f-srv') ? $('f-srv').value : '').trim();
    var usr = ($('f-usr') ? $('f-usr').value : '').trim();
    var pwd = $('f-pwd') ? $('f-pwd').value : '';

    if (!srv) {
      showAlert('Please enter your Xtream server URL.', 'error');
      if ($('f-srv')) $('f-srv').focus();
      return false;
    }
    if (!/^https?:\/\//i.test(srv)) {
      showAlert('Server URL must start with http:// or https://', 'error');
      if ($('f-srv')) $('f-srv').focus();
      return false;
    }
    if (!usr) {
      showAlert('Please enter your username.', 'error');
      if ($('f-usr')) $('f-usr').focus();
      return false;
    }
    if (!pwd) {
      showAlert('Please enter your password.', 'error');
      if ($('f-pwd')) $('f-pwd').focus();
      return false;
    }

    payload.server_url = srv;
    payload.username = usr;
    payload.password = pwd;
  }

  setBusy('save-btn', true, 'Save Configuration');

  fetch('/api/device/' + currentDeviceId + '/configure', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Accept': 'application/json'
    },
    body: JSON.stringify(payload)
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (data && data.success) {
      window.location.href = '/success?device_id=' + currentDeviceId;
    } else {
      var msg = (data && data.error && data.error.message) ? data.error.message : 'Unable to save configuration.';
      showAlert(msg, 'error');
      setBusy('save-btn', false, 'Save Configuration');
    }
  })
  .catch(function(err) {
    showAlert('Cannot connect to server. Please try again.', 'error');
    setBusy('save-btn', false, 'Save Configuration');
  });

  return false;
}

// Initialise on load
document.addEventListener('DOMContentLoaded', function() {
  var q = new URLSearchParams(window.location.search);
  var raw = (q.get('device-id') || q.get('device_id') || q.get('deviceId') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').trim();

  var input = $('id-input');
  if (input) {
    input.addEventListener('input', function() {
      var s = this.selectionStart;
      this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      try { this.setSelectionRange(s, s); } catch(e) {}
    });
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        connectDevice();
      }
    });
  }

  // Also bind button click directly via JS listener for extra safety
  var idBtn = $('id-btn');
  if (idBtn) {
    idBtn.addEventListener('click', connectDevice);
  }

  var tabM3u = $('tab-m3u');
  if (tabM3u) {
    tabM3u.addEventListener('click', function() { switchTab('m3u'); });
  }

  var tabXtream = $('tab-xtream');
  if (tabXtream) {
    tabXtream.addEventListener('click', function() { switchTab('xtream'); });
  }

  var cfgForm = $('cfg-form');
  if (cfgForm) {
    cfgForm.addEventListener('submit', doSubmit);
  }

  if (raw.length === 8) {
    // Check if device was registered by the FOX PLAYER app
    fetch('/api/device/' + raw + '/status')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data && data.success) {
          showConfig(raw);
          if (data.configured && data.config_type) {
            switchTab(data.config_type);
          }
        } else {
          showAlert('Device not found. Please install and launch FOX PLAYER app first to get your Device ID.', 'error');
          if (input) {
            input.value = raw;
            input.focus();
          }
        }
      })
      .catch(function() {
        showAlert('Cannot connect to server. Please check your connection.', 'error');
      });
  }
});
</script>

</body>
</html>
